# 还没收到云端推送时，这台 agent 依据的那一份。
#
# 🔴 这份文件**不是**真相源。真相源是云端的 app.support_ledger，
# 由 publish-ledger / 控制台发布，经 update_capability_matrix 推下来，
# 落在边缘库的 capability_matrix 表里。main.rs 优先用存储里那一份,
# 只有取不到或解析不了才回落到这里。
#
# 2026-09-05：删掉了 9 条 —— EC25-CN 的 4 条、EG25-G 的 4 条，以及
# EC20 × CN-Unicom。它们从未进过云端账本，也就没人说得出是谁在什么硬件上
# 测的；账本的价值全在「里面写的都是量出来的」，所以作废而不是补录。
#
# 留着它们的危害是具体的：一台还没收到推送的边缘机会拿这些已作废的结论去开
# 纳管的闸，而面板会把它报成 `rule` —— 读的人以为背后有一次测量。
# edge-core/tests/sms_matrix.rs 的 voided_pairs_read_as_untested_in_the_builtin_matrix
# 钉住了这个后果。
#
# 2026-09-18：删掉两处没有出处的 `data = supported`（EC20 × CN-Mobile、
# EC20 × Generic-International）。云端账本 app.support_ledger 里这两对**没有
# data 这一项**，而这里写着 supported —— 一台还没收到推送的机器会拿这个没有出处
# 的结论去拉数据面，那是花钱的方向。并排量过的三处差异是：
#
#                              内置(改前)  云端
#   EC20×CN-Mobile  Data       放行        拒绝(untested)   ← 这次删掉
#   EC20×Generic    Data       放行        拒绝(untested)   ← 这次删掉
#   EC20×Generic    SmsReceive 拒绝        放行             ← 保留不动
#
# 最后一行**故意不改**：内置这份少说了一项。少说只会让还没收到推送的机器更保守，
# 而那时候保守正是对的；补上去反而成了一个没有推送依据的放行。
#
# ⚠️ 两份的版本号都写着 2026-09-05，看起来像同一份 —— 这正是「两个真相源」最
#    难发现的形状。现在由
#    edge-core/tests/sms_matrix.rs 的
#    the_builtin_matrix_claims_nothing_the_cloud_ledger_does_not 钉住：这份文件
#    里的每一条 `supported` 都必须在云端账本里有出处，而那份账本以夹具的形式写在
#    那条测试里 —— 账本变了就得有人来改它，那一刻正是该重新想一遍的时候。
#
# 🔴 内置矩阵作为「第二个真相源」的问题**没有**被解决，只是不再能悄悄扩大。
#    彻底的解法（要不要干脆不带内置矩阵）原本指向
#    vodoge-cloud/docs/device-catalogue.md —— 那份文档**不存在**，2026-09-18 查过。
version = "2026-09-05"

[fallback]
sms_mo = { kind = "probe" }
sms_mt = { kind = "probe" }
data = { kind = "probe" }
voice = { kind = "probe" }

[[rule]]
modem_family = "EC20"
carrier = "CN-Telecom"
sms_mo = { kind = "unsupported", reason = "no_cdma_fallback_and_no_ct_volte_mbn" }
sms_mt = { kind = "unsupported", reason = "no_cdma_fallback_and_no_ct_volte_mbn" }
data = { kind = "supported", bearer = "cellular" }

[[rule]]
modem_family = "EC20"
carrier = "CN-Mobile"
sms_mo = { kind = "supported", bearer = "cellular" }
sms_mt = { kind = "supported", bearer = "cellular" }
# data 删掉：云端账本（app.support_ledger）里这一对**没有 data 这一项**。
# 留着它，一台还没收到推送的机器会拿一个没有出处的结论去拉数据面 —— 那是花钱
# 的方向。删掉之后它回落到 fallback 的 probe，也就是「没测过，先别拉」。
# 2026-09-18，由 the_builtin_matrix_claims_nothing_the_cloud_ledger_does_not 抓出。

[[rule]]
modem_family = "EC20"
carrier = "Generic-International"
sms_mo = { kind = "probe" }
# ⚠️ 云端账本这一对的 sms_mt 是 supported，而这里是 probe —— 内置这份**少说**了。
#    少说不改，也不该改：还没收到推送的时候保守是对的，而补上去就成了一个没有
#    推送依据的放行。那条守卫只管「内置比云端多说」的方向，理由见它的注释。
sms_mt = { kind = "probe" }
# data 删掉，同上：云端账本里这一对没有 data 这一项。
