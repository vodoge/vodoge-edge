[package]
name = "edge-ui"
version.workspace = true
edition.workspace = true

# `rlib` alongside `cdylib` so the crate can also be depended on by a test
# target; `cdylib` is what wasm-bindgen needs.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
edge-panel-api = { path = "../edge-panel-api" }
# 🔴 Pinned to the 0.7 line on purpose. thaw 0.4.8 — the newest *stable* thaw —
# requires `leptos ^0.7.7`, and leptos itself is already at 0.8.20. The trade
# was made deliberately: a stable component library on an older framework,
# rather than a beta component library on the current one. Revisit when the
# panel is switched over; see docs/frontend-rebuild/edge-leptos.md.
leptos = { version = "0.7.8", features = ["csr"] }
thaw = { version = "0.4.8", features = ["csr"] }
gloo-net = { version = "0.7", default-features = false, features = ["http", "json"] }
wasm-bindgen-futures = "0.4"
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2"
