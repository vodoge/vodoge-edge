<!doctype html>
<!--
  trunk 的入口。产物（index.html + glue .js + .wasm）由 edge-panel 在构建时
  用 include_str! / include_bytes! 嵌进二进制，所以这里不引用任何外部资源 ——
  面板的既有性质是「零外部资源」，重建不该把它弄丢。
-->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VoDoge 边缘面板</title>
    <link data-trunk rel="rust" data-wasm-opt="z" />

    <!--
      🔴 这是**唯一**一处改 Thaw 默认值的地方，而且必须保持唯一。

      `docs/frontend-rebuild/README.md` 定的做法是「改库的默认尺寸，集中改一次，
      不是逐个组件手写覆盖——那样等于又回到手写」。云端那半边照这条做完之后，
      调用点对 h-/p- 的手写覆盖是 **0 处**；这一半要守住同样的数。

      往下加规则之前先问一句：这是在改**库的默认**，还是在给某一个组件描边？
      后者不属于这里，也不属于任何地方。
    -->
    <style>
      /* ① 表格：table-layout 从 fixed 改回 auto。
         Thaw 默认 fixed + 等宽列，于是六列各占 116px，而 IMEI 要 152px、
         ICCID 要 166px —— 它们溢出单元格并和邻列视觉重叠。这不是密度问题，
         是**内容读不出来**：15 位 IMEI 和 20 位 ICCID 是一位一位对着念的东西。 */
      .thaw-table { table-layout: auto; }

      /* ② 密度。Thaw 的单元格默认 44px 高，那是给触屏列表的尺寸；这是一块要在
         一屏里塞下整个机队的运维面板。32px 是云端那半边量过之后落在的同一个数
         （表头 h-12 → h-8）。 */
      .thaw-table-cell { height: 32px; }
      .thaw-table-header-cell { height: 28px; }

      /* ③ 标识符用等宽。IMEI、ICCID、IMSI 都是一位一位对着读的，比例字体下
         「0」和「O」、「1」和「l」要靠猜。 */
      .thaw-table-cell { font-variant-numeric: tabular-nums; }

      /* ══ 页面骨架 ═══════════════════════════════════════════════════════
         ⚠️ 这一段和上面三条不是一回事：上面改的是 Thaw **组件**的默认值，这里
         是**页面自身的排布**——三栏各多宽、哪块滚哪块不滚。Thaw 没有、也不该
         有这个，`Layout`/`LayoutSider` 只负责把它们摆成一行并各自套一个
         `Scrollbar`；宽度是这块面板自己的决定。

         🔴 为什么是三栏而不是一根长条：左栏「有哪几根」、中栏「对选中这根做
         什么」、右栏「daemon 此刻在说什么」——排障时这三个问题是**同时**要看
         的。第一版 Leptos 面板把所有卡片竖着堆起来，功能一个不少，但一屏能看
         到的东西少了一大半。 */

      html, body { height: 100%; margin: 0; }

      :root {
        --vd-rail: 15.5rem;   /* 左栏：放得下 15 位 IMEI 加一个状态徽章 */
        --vd-logs: 26rem;     /* 右栏：放得下一行日志而不折行 */
      }
      @media (max-width: 1400px) { :root { --vd-rail: 14rem; --vd-logs: 22rem; } }
      @media (max-width: 1180px) { :root { --vd-rail: 13rem; --vd-logs: 18rem; } }

      .vd-top {
        display: flex; align-items: center; gap: 12px;
        padding: 6px 12px;
        border-bottom: 1px solid var(--colorNeutralStroke2);
        flex: 0 0 auto;
      }
      .vd-brand { font-weight: 650; }
      .vd-top-end { margin-left: auto; }

      /* ── 外壳：顶栏钉住，三栏各滚各的 ──────────────────────────────
         🔴 **规则挂在 `content_class` 上，不能挂在 `class` 上。**

         `Layout` 的 `class` 落到外层一个 `display:block` 的 div；真正能排布
         的是内层滚动节点 `.thaw-scrollbar__content`，`content_class` 才够得到
         它。挂错了不报错、不警告，只是**安静地不生效**——2026-09-04 就是这么
         让三个标签跑到视口外面去的。`shell.rs` 的 `layout_wiring` 守着这条。

         高度这条链一环都不能断，断哪一环都会退回「整块一起滚」：
           .vd-shell  height:100%  →  .vd-deck  flex:1 + min-height:0
             →  .vd-rail / .vd-main / .vd-logs  height:100% + min-height:0
         `min-height: 0` 不是可选项：flex 子项默认 `min-height:auto`，会被内容
         撑开而不是被父级夹住，985 行日志就是这么把栏子顶到 11198px 的。 */
      .vd-shell {
        display: flex;
        flex-direction: column;
        height: 100%;
        width: 100%;
        min-height: 0;
      }
      .vd-shell > .vd-deck {
        flex: 1 1 auto;
        min-height: 0;
        display: flex;
        flex-direction: row;
        /* 1px 的缝隙是**分隔线**，不是留白：背景色从缝里透出来，正好画出两条
           栏界。给它一个间距档位反而会变成一条 4px 的灰带。 */
        gap: 1px;
        background: var(--colorNeutralStroke2);
      }
      .vd-rail, .vd-logs, .vd-main { background: var(--colorNeutralBackground1); }

      /* ⚠️ 选择器要比**单个类**重。Thaw 的样式是运行时 `mount_style` 追加到
         `<head>` 末尾的，排在这张表后面；同为 (0,1,0) 时后来者胜，而
         `.thaw-layout-sider` 自带 `min-width: 240px`。 */
      .vd-deck > .vd-rail { flex: 0 0 var(--vd-rail); min-width: var(--vd-rail); }
      .vd-deck > .vd-logs { flex: 0 0 var(--vd-logs); min-width: var(--vd-logs); }
      .vd-deck > .vd-main { flex: 1 1 auto; min-width: 0; }
      .vd-deck > * { height: 100%; min-height: 0; }

      /* 一栏（或栏里的一块）：头不动，身子滚。头上是标题、新鲜度和这一栏的
         动作按钮——滚走了就要人先滚回去才能按。 */
      .vd-pane { display: flex; flex-direction: column; min-height: 0; }
      .vd-pane-head {
        display: flex; align-items: center; gap: 8px;
        padding: 6px 10px;
        border-bottom: 1px solid var(--colorNeutralStroke2);
        flex: 0 0 auto;
      }
      .vd-pane-head-end { margin-left: auto; display: flex; align-items: center; gap: 6px; }
      .vd-pane-body { padding: 8px 10px; min-height: 0; }
      .vd-tabs { padding: 0 6px; }

      .vd-rail-foot {
        border-top: 1px solid var(--colorNeutralStroke2);
        margin-top: auto;
      }

      /* ── 左栏里的一根模组 ────────────────────────────────────────────
         六列的表塞不进 15rem，所以竖着堆。⚠️ 卡归属和驻留网络是**两行**：
         生产机队里三根 QMI 模组全在漫游，只画驻留网络的话有两根看起来一模
         一样，而它们的卡分别来自香港和美国。 */
      .vd-modem-list { display: flex; flex-direction: column; gap: 6px; }
      .vd-modem {
        display: flex; flex-direction: column; gap: 1px;
        width: 100%; text-align: left; cursor: pointer;
        padding: 6px 8px;
        border: 1px solid var(--colorNeutralStroke2);
        border-radius: 4px;
        background: var(--colorNeutralBackground1);
        color: inherit; font: inherit;
      }
      .vd-modem:hover { background: var(--colorNeutralBackground1Hover); }
      .vd-modem--on {
        border-color: var(--colorBrandStroke1);
        background: var(--colorBrandBackground2);
      }
      .vd-modem-top { display: flex; align-items: center; gap: 6px; }
      .vd-modem-imei {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        letter-spacing: .01em;
      }
      .vd-modem-line { font-size: 11px; line-height: 1.45; }
      .vd-modem-flags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
      .vd-faint { color: var(--colorNeutralForeground3); }

      /* ── 左栏里的一个候选 ────────────────────────────────────────────
         和模组卡同一个形状：六列的表塞不进 15rem。 */
      .vd-cand-list { display: flex; flex-direction: column; gap: 5px; }
      .vd-cand {
        display: flex; flex-direction: column; gap: 2px;
        padding: 5px 7px;
        border: 1px solid var(--colorNeutralStroke2);
        border-radius: 4px;
        font-size: 11px;
      }
      .vd-cand-cell { min-width: 0; word-break: break-word; }

      /* ── 日志行 ──────────────────────────────────────────────────────
         26rem 塞不下四列表格，所以两行一条：短的元信息一行，行文独占一行。
         左边那条色带是给「竖着扫一眼只找红的」用的。 */
      .vd-log { display: flex; flex-direction: column; }
      .vd-log-row {
        padding: 3px 6px 4px;
        border-bottom: 1px solid var(--colorNeutralStroke3);
        border-left: 2px solid transparent;
      }
      .vd-log-row--warn { border-left-color: var(--colorPaletteDarkOrangeBorderActive); }
      .vd-log-row--err  { border-left-color: var(--colorPaletteRedBorderActive); }
      .vd-log-meta { display: flex; align-items: center; gap: 5px; font-size: 11px; }
      .vd-log-at { font-variant-numeric: tabular-nums; color: var(--colorNeutralForeground3); }
      .vd-log-text {
        font-size: 11px; line-height: 1.45;
        word-break: break-word;
      }

      /* 各页顶部那一排动作按钮（原来在 Card 头里）。 */
      .vd-actions {
        display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
        margin-bottom: 6px;
      }

      /* 900px 以下三栏读不了，摊成一列——诚实地承认屏幕不够，好过硬挤。
         摊开之后不再各滚各的，整页一个滚动条才是窄屏上对的行为。 */
      @media (max-width: 900px) {
        .vd-shell { height: auto; min-height: 100%; }
        .vd-shell > .vd-deck { flex-direction: column; }
        .vd-deck > .vd-rail, .vd-deck > .vd-logs {
          flex: 0 0 auto; min-width: 0;
        }
        .vd-deck > * { height: auto; }
        .vd-deck > .vd-main { min-height: 60vh; }
      }
    </style>
  </head>
  <body></body>
</html>
